name: backend-ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj obraz backendu
        run: docker compose build backend

      - name: Uruchom bazę danych
        run: docker compose up -d db

      - name: Uruchom testy
        env:
          DB_HOST: db
          POSTGRES_USER: breach_checker
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: breach_checker_test
        run: docker compose run --rm backend pytest

      - name: Posprzątaj (kontenery i wolumeny)
        if: always()
        run: docker compose down -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zaloguj się do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zbuduj obraz produkcyjny
        run: docker build -f backend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/breach-checker-backend:${{ github.sha }} backend/

      - name: Otaguj jako latest
        run: docker tag ghcr.io/${{ github.repository_owner }}/breach-checker-backend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/breach-checker-backend:latest

      - name: Wypchnij oba tagi
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/breach-checker-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/breach-checker-backend:latest

  verify-image-runs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zaloguj się do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Uruchom obraz razem z bazą danych
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.verify.yml up -d

      - name: Sprawdź, czy usługa odpowiada
        run: |
          sleep 3
          curl --fail http://localhost:8000/health

      - name: Posprzątaj (kontenery i wolumeny)
        if: always()
        run: docker compose -f docker-compose.verify.yml down -v