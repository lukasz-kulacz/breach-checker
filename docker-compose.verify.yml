services:
  backend:
    image: ghcr.io/${OWNER}/breach-checker-backend:${IMAGE_TAG}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://breach_checker:test_password@db:5432/breach_checker_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: breach_checker
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: breach_checker_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breach_checker"]
      interval: 5s
      timeout: 5s
      retries: 10