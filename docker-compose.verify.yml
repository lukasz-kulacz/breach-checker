services:
  backend:
    image: ghcr.io/lukasz-kulacz/breach-checker-backend:${IMAGE_TAG}
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: breach_checker_test
      DB_USER: breach_checker
      DB_PASSWORD: test_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: breach_checker
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: breach_checker_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breach_checker"]
      interval: 5s
      timeout: 5s
      retries: 10